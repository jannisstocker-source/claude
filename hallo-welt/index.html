<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Hallo Welt</title>
  <style>
    /* Farben für den hellen Modus (Standard) */
    :root {
      --bg: #f5f3ee;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #5c6370;
      --accent: #c2410c;
      --border: #e4e0d8;
      --shadow: 0 10px 30px rgba(31, 35, 40, 0.08);
    }

    /* Farben für den dunklen Modus, wenn das System ihn vorgibt */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --card: #1d2026;
        --text: #e8e6e1;
        --muted: #a0a6b0;
        --accent: #fb923c;
        --border: #2c3038;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 34rem;
      padding: clamp(1.5rem, 5vw, 3rem);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2.25rem, 9vw, 3.5rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    /* Kleiner Akzentstrich unter der Überschrift */
    h1::after {
      content: "";
      display: block;
      width: 3rem;
      height: 4px;
      margin-top: 0.75rem;
      border-radius: 2px;
      background: var(--accent);
    }

    p {
      margin: 0 0 1.25rem;
      font-size: 1.0625rem;
    }

    .datum {
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .datum time {
      color: var(--text);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hallo Welt</h1>
    <p>Diese Seite wurde von einer Claude-Cloud-Session gebaut.</p>
    <p class="datum">Heute ist <time id="datum">…</time>.</p>
  </main>

  <script>
    // Aktuelles Datum auf Deutsch anzeigen, z. B. „Mittwoch, 4. November 2026“
    const jetzt = new Date();
    const datumElement = document.getElementById("datum");
    datumElement.textContent = jetzt.toLocaleDateString("de-DE", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    });
    datumElement.dateTime = jetzt.toISOString().slice(0, 10);
  </script>
</body>
</html>
