/* ---------- Farben: „Wohnzimmer am Abend“ (siehe tv-home/DESIGN.md) ---------- */
:root {
  --bg: #F4EFE6;
  --bg-2: #EAE3D6;
  --surface: #FFFCF7;
  --surface-2: #F3EDE3;
  --surface-3: #E9E1D3;
  --line: rgba(14, 20, 36, .09);
  --line-strong: rgba(14, 20, 36, .16);
  --ink: #0E1424;
  --ink-2: #394052;
  --muted: #656B7A;
  --accent: #F2B66D;
  --accent-ink: #2A1A06;
  --accent-mark: #B8701F;
  --accent-soft: rgba(242, 182, 109, .22);
  --glow: rgba(242, 182, 109, .30);
  --grid: #E3DCCF;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --good: #0c8a0c;
  --bad: #d03b3b;
  --shadow: 0 1px 2px rgba(14, 20, 36, .05), 0 8px 24px -12px rgba(14, 20, 36, .12);
  --radius: 20px;
  --radius-s: 12px;
  --font: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1424;
    --bg-2: #090D18;
    --surface: #161D30;
    --surface-2: #1D2539;
    --surface-3: #262F47;
    --line: rgba(244, 239, 230, .08);
    --line-strong: rgba(244, 239, 230, .16);
    --ink: #F4EFE6;
    --ink-2: #CBC6BC;
    --muted: #8C93A3;
    --accent-mark: #F2B66D;
    --accent-soft: rgba(242, 182, 109, .14);
    --glow: rgba(242, 182, 109, .16);
    --grid: #252E45;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --good: #3cc13c;
    --bad: #e66767;
    --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 10px 30px -16px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1424;
  --bg-2: #090D18;
  --surface: #161D30;
  --surface-2: #1D2539;
  --surface-3: #262F47;
  --line: rgba(244, 239, 230, .08);
  --line-strong: rgba(244, 239, 230, .16);
  --ink: #F4EFE6;
  --ink-2: #CBC6BC;
  --muted: #8C93A3;
  --accent-mark: #F2B66D;
  --accent-soft: rgba(242, 182, 109, .14);
  --glow: rgba(242, 182, 109, .16);
  --grid: #252E45;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --good: #3cc13c;
  --bad: #e66767;
  --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 10px 30px -16px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

/* ---------- Grundlagen ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  background-image: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
/* Raumlicht: weicher Lichtkegel von oben wie von einer Stehlampe */
body::before {
  content: "";
  position: fixed;
  inset: -20vh -10vw auto auto;
  width: 70vw;
  height: 70vh;
  background: radial-gradient(closest-side, var(--glow), transparent 75%);
  pointer-events: none;
  z-index: 0;
}
.sprite { display: none; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic-s { width: 16px; height: 16px; }
.ic-l { width: 28px; height: 28px; }
.ic-fill { fill: currentColor; stroke: none; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.2; }
h1 { font-family: var(--serif); font-size: clamp(28px, 4vw, 38px); letter-spacing: -.01em; }
h2 { font-size: 17px; }
h3 { font-size: 15px; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.serif { font-family: var(--serif); }
.nowrap { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- Rahmen: Seitenleiste (Desktop) und Tab-Leiste (Handy) ---------- */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 4px;
  padding: 22px 14px;
  border-right: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 12px 22px; text-decoration: none; font-family: var(--serif); font-size: 22px; font-weight: 600; }
.brand-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 18px 4px var(--glow); }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 12px;
  color: var(--ink-2); text-decoration: none; font-weight: 500;
  transition: background .18s ease-out, color .18s ease-out;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--accent-soft); color: var(--ink); }
.nav-item.active .ic { color: var(--accent-mark); }
.nav-settings { margin-top: auto; }
.side-sync { padding: 8px 12px 0; font-size: 12px; color: var(--muted); }
.main { min-width: 0; padding: 32px clamp(16px, 3.4vw, 44px) 120px; outline: none; }
.view-inner { max-width: 1240px; margin: 0 auto; animation: fadeIn .22s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

@media (max-width: 899px) {
  .app { display: block; }
  .side {
    position: fixed; z-index: 30; inset: auto 0 0 0; top: auto; height: auto;
    flex-direction: row; justify-content: space-around; gap: 0;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    border-right: 0; border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    backdrop-filter: blur(18px) saturate(1.4);
  }
  .brand, .side-sync, .nav-settings { display: none; }
  .nav-item { flex: 1; flex-direction: column; gap: 2px; padding: 6px 2px; font-size: 11px; border-radius: 10px; }
  .nav-item .ic { width: 22px; height: 22px; }
  .nav-item.active { background: transparent; }
  .main { padding: calc(18px + env(safe-area-inset-top)) 16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom)); }
}

/* ---------- Seitenkopf und Unter-Navigation ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head .sub { color: var(--muted); margin-top: 6px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.mobile-only { display: none !important; }
@media (max-width: 899px) { .mobile-only { display: inline-grid !important; } .desktop-only { display: none !important; } }
.tabs {
  display: flex; gap: 4px; padding: 4px; margin: 0 0 22px;
  background: var(--surface-2); border-radius: 14px; width: max-content; max-width: 100%;
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; background: transparent; padding: 8px 14px; border-radius: 10px;
  color: var(--ink-2); font-weight: 600; font-size: 14px; white-space: nowrap; text-decoration: none;
  transition: background .18s ease-out;
}
.tab:hover { color: var(--ink); }
.tab.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 10px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* ---------- Karten und Raster ---------- */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-7 { grid-column: span 7; }
.span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-4 { grid-column: span 4; } .span-3 { grid-column: span 3; }
@media (max-width: 1180px) { .span-3 { grid-column: span 6; } .span-4 { grid-column: span 6; } .span-8, .span-7, .span-5 { grid-column: span 12; } }
@media (max-width: 720px) { .grid > * { grid-column: span 12; } .grid { gap: 12px; } .grid > .half-m { grid-column: span 6; } }
.card {
  position: relative; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow);
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; min-height: 30px; }
.card-head h2 { display: flex; align-items: center; gap: 8px; }
.card-head .ic { color: var(--accent-mark); }
.card-link { text-decoration: none; color: inherit; display: block; transition: transform .18s ease-out, border-color .18s ease-out; }
.card-link:hover { border-color: var(--accent); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.divider { height: 1px; background: var(--line); margin: 14px 0; border: 0; }
.empty { padding: 26px 12px; text-align: center; color: var(--muted); }
.empty .ic { width: 34px; height: 34px; color: var(--accent-mark); margin-bottom: 8px; }

/* Kennzahlen */
.stat-label { color: var(--muted); font-size: 13px; font-weight: 500; }
.stat-value { font-size: 30px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 6px; }
.stat-value small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.stat-foot { margin-top: 6px; font-size: 13px; color: var(--muted); }
.delta-up { color: var(--good); font-weight: 600; }
.delta-down { color: var(--bad); font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
.kpis .card { padding: 16px 18px; }

/* ---------- Knöpfe und Eingaben ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 8px 16px; border-radius: 12px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap;
  transition: background .15s ease-out, border-color .15s ease-out, transform .1s ease-out;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); box-shadow: 0 6px 20px -8px var(--glow); }
.btn-primary:hover { background: #F5C383; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { color: var(--bad); }
.btn-s { min-height: 32px; padding: 4px 10px; font-size: 13px; border-radius: 10px; }
.btn-l { min-height: 52px; padding: 12px 22px; font-size: 16px; border-radius: 16px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn {
  display: inline-grid; place-items: center; width: 38px; height: 38px; flex: none;
  border-radius: 11px; border: 1px solid transparent; background: transparent; color: var(--ink-2);
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.bordered { border-color: var(--line-strong); }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 0 0 16px; }
@media (max-width: 720px) { .quick { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.quick-btn {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 64px;
  border-radius: 16px; border: 1px solid var(--line); background: var(--surface);
  text-decoration: none; font-weight: 600; text-align: left; box-shadow: var(--shadow);
  transition: border-color .18s ease-out, transform .1s ease-out;
}
.quick-btn:hover { border-color: var(--accent); }
.quick-btn:active { transform: scale(.98); }
.quick-btn .qi { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-mark); flex: none; }
.quick-btn small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); min-width: 0; }
.input, select.input, textarea.input {
  width: 100%; min-height: 42px; padding: 9px 12px;
  border-radius: 11px; border: 1px solid var(--line-strong); background: var(--surface);
  font-size: 16px; font-weight: 500; color: var(--ink);
}
textarea.input { min-height: 80px; resize: vertical; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input::placeholder { color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.check { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.check input { width: 20px; height: 20px; accent-color: var(--accent-mark); }
.search-box { position: relative; }
.search-box .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search-box .input { padding-left: 40px; }

/* ---------- Listen ---------- */
.list { display: flex; flex-direction: column; }
.li {
  display: flex; align-items: center; gap: 12px; padding: 11px 4px;
  border-bottom: 1px solid var(--line); min-width: 0;
}
.li:last-child { border-bottom: 0; }
button.li, a.li { width: 100%; background: transparent; border-left: 0; border-right: 0; border-top: 0; text-align: left; text-decoration: none; border-radius: 0; }
button.li:hover, a.li:hover { background: var(--surface-2); }
.li-main { flex: 1; min-width: 0; }
.li-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-end { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; flex: none; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 600; white-space: nowrap;
}
.chip-accent { background: var(--accent-soft); color: var(--ink); }
.chip-btn { border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; padding: 6px 12px; font-size: 13px; }
.chip-btn.active { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.badge-pr { display: inline-flex; align-items: center; gap: 3px; color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 1px 7px; font-size: 11px; font-weight: 700; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }

/* ---------- Fortschrittsbalken ---------- */
.bar { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 99px; background: var(--accent-mark); transition: width .4s ease-out; }
.bar.over > span { background: var(--bad); }
.macro { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.macro-head { display: flex; justify-content: space-between; font-size: 13px; }
.macro-head b { font-weight: 600; }
.hbars { display: flex; flex-direction: column; gap: 10px; }
.hbar { display: grid; grid-template-columns: 112px minmax(0, 1fr) 48px; align-items: center; gap: 10px; font-size: 13px; }
.hbar-track { height: 14px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.hbar-track span { display: block; height: 100%; background: var(--accent-mark); border-radius: 0 4px 4px 0; }
.hbar-val { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Kalorien-Ring */
.ring-wrap { position: relative; width: 168px; height: 168px; flex: none; }
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { stroke: var(--surface-3); }
.ring-fg { stroke: var(--accent-mark); transition: stroke-dashoffset .5s ease-out; }
.ring-fg.over { stroke: var(--bad); }
.ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-center b { font-size: 30px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.ring-center span { font-size: 12px; color: var(--muted); font-weight: 600; }
.ring-s { width: 112px; height: 112px; }
.ring-s .ring-center b { font-size: 21px; }
.equation { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; text-align: center; font-variant-numeric: tabular-nums; }
.equation div { display: flex; flex-direction: column; min-width: 0; }
.equation b { font-size: 18px; font-weight: 700; }
.equation span { font-size: 12px; color: var(--muted); }
.equation i { font-style: normal; color: var(--muted); font-size: 18px; padding-top: 1px; }
.equation .result b { color: var(--accent-mark); }

/* ---------- Diagramme ---------- */
.chart { position: relative; width: 100%; min-height: 200px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .baseline { stroke: var(--line-strong); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--accent-mark); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent-mark); opacity: .10; }
.chart .pt { fill: var(--accent-mark); stroke: var(--surface); stroke-width: 2; }
.chart .bar-mark { fill: var(--accent-mark); }
.chart .bar-mark.dim { opacity: .35; }
.chart .bar-mark.over { fill: var(--bad); }
.chart .goal { stroke: var(--ink-2); stroke-width: 1.2; stroke-dasharray: 4 4; }
.chart .goal-label { fill: var(--ink-2); font-weight: 600; }
.chart .cross { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .hot { fill: var(--accent-mark); stroke: var(--surface); stroke-width: 2.5; }
.chart .hit { fill: transparent; }
.chart-empty { display: grid; place-items: center; min-height: 180px; color: var(--muted); font-size: 14px; text-align: center; }
.tooltip {
  position: fixed; z-index: 80; pointer-events: none;
  background: var(--ink); color: var(--bg); border-radius: 10px; padding: 7px 10px;
  font-size: 12.5px; line-height: 1.35; box-shadow: 0 8px 24px -8px rgba(0, 0, 0, .4);
  max-width: 240px; font-variant-numeric: tabular-nums;
}
.tooltip b { font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; }
.heat i { display: block; aspect-ratio: 1; border-radius: 3px; background: var(--surface-3); min-width: 0; }
.heat i[data-l="1"] { background: color-mix(in srgb, var(--accent-mark) 40%, var(--surface-3)); }
.heat i[data-l="2"] { background: color-mix(in srgb, var(--accent-mark) 70%, var(--surface-3)); }
.heat i[data-l="3"] { background: var(--accent-mark); }
.heat i.today { outline: 1.5px solid var(--ink); outline-offset: 1px; }
.week-dots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.week-dots div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.week-dots i { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); color: var(--accent-ink); }
.week-dots i.on { background: var(--accent); }
.week-dots i.run { background: var(--surface-3); color: var(--ink); }
.week-dots i.on.run { background: var(--accent); }
.week-dots .today { color: var(--ink); font-weight: 700; }

/* ---------- Übersicht ---------- */
.hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.hero h1 { font-size: clamp(32px, 5vw, 46px); }
.hero .sub { color: var(--muted); margin-top: 6px; font-size: 15px; }
.hero-time { font-family: var(--serif); font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-2); }
@media (max-width: 720px) {
  .hero-time { display: none; }
  .hero { flex-wrap: nowrap; align-items: flex-start; }
  .hero > div:first-child { min-width: 0; }
  .quick-btn { padding: 12px; min-height: 56px; gap: 10px; font-size: 14px; }
  .quick-btn small { display: none; }
  .quick-btn .qi { width: 34px; height: 34px; }
  .diary-sum { justify-content: center; }
}
.banner {
  display: flex; align-items: center; gap: 14px; padding: 14px 18px; margin-bottom: 16px;
  border-radius: 16px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600;
  box-shadow: 0 10px 30px -14px var(--glow);
}
.banner .grow small { display: block; font-weight: 500; opacity: .8; }

/* ---------- Training ---------- */
.ex-card { padding: 16px; }
.ex-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ex-name { font-weight: 700; font-size: 16px; color: var(--accent-mark); background: none; border: 0; padding: 0; text-align: left; }
.sets { width: 100%; border-collapse: separate; border-spacing: 0 4px; font-variant-numeric: tabular-nums; }
.sets th { font-size: 11px; font-weight: 700; color: var(--muted); text-align: center; padding: 0 4px 2px; text-transform: none; }
.sets td { text-align: center; padding: 0 3px; }
.sets tr.done td { background: var(--accent-soft); }
.sets tr.done td:first-child { border-radius: 10px 0 0 10px; }
.sets tr.done td:last-child { border-radius: 0 10px 10px 0; }
.set-type { width: 32px; height: 32px; border-radius: 9px; border: 0; background: var(--surface-2); font-weight: 700; font-size: 13px; }
.set-type.w { color: #b38200; }
.set-type.d { color: var(--s1); }
.set-prev { border: 0; background: transparent; color: var(--muted); font-size: 13px; padding: 4px; min-width: 64px; }
.set-in { width: 100%; max-width: 76px; min-height: 36px; text-align: center; padding: 4px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 700; font-size: 16px; }
.set-in:focus { outline: none; border-color: var(--accent); }
.set-in::placeholder { font-weight: 500; color: var(--muted); opacity: .75; }
.set-ok { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); display: inline-grid; place-items: center; color: var(--muted); }
.set-ok.on { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.set-del { width: 28px; height: 28px; border: 0; background: transparent; color: var(--muted); display: inline-grid; place-items: center; border-radius: 8px; }
.set-del:hover { color: var(--bad); }
.wo-head { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 0; margin-bottom: 8px; background: linear-gradient(var(--bg) 70%, transparent); }
.wo-title { font-family: var(--serif); font-size: 26px; font-weight: 600; background: transparent; border: 0; border-bottom: 1px dashed transparent; padding: 0; width: 100%; min-width: 0; }
.wo-title:focus { outline: none; border-bottom-color: var(--accent); }
.wo-clock { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ex-list { display: flex; flex-direction: column; gap: 12px; }
.pick-list { max-height: 50vh; overflow-y: auto; margin: 0 -4px; }
.muscle-tag { font-size: 12px; color: var(--muted); }
.template-card { display: flex; flex-direction: column; gap: 10px; }
.template-card ul { margin: 0; padding: 0; list-style: none; color: var(--muted); font-size: 13px; }

/* Timer */
.timer-pill {
  position: fixed; z-index: 40; left: 50%; transform: translateX(-50%);
  bottom: calc(24px + env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px;
  border-radius: 999px; background: var(--ink); color: var(--bg);
  box-shadow: 0 12px 40px -12px rgba(0, 0, 0, .5); font-variant-numeric: tabular-nums;
}
@media (max-width: 899px) { .timer-pill { bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom)); } }
@media (max-width: 480px) {
  .timer-pill { gap: 6px; padding: 6px 6px 6px 12px; max-width: calc(100vw - 20px); }
  .timer-pill .tp-bar { display: none; }
  .timer-pill .tiny { max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
}
.timer-pill b { font-size: 20px; min-width: 56px; }
.timer-pill .tp-bar { width: 70px; height: 4px; border-radius: 4px; background: rgba(128, 128, 128, .35); overflow: hidden; }
.timer-pill .tp-bar span { display: block; height: 100%; background: var(--accent); }
.timer-pill button { border: 0; background: rgba(128, 128, 128, .22); color: inherit; border-radius: 999px; min-width: 40px; height: 34px; font-weight: 700; font-size: 13px; }
.timer-pill.done { background: var(--accent); color: var(--accent-ink); animation: pulse 1s ease-in-out 3; }
@keyframes pulse { 50% { transform: translateX(-50%) scale(1.06); } }
.big-time { font-family: var(--serif); font-size: clamp(56px, 12vw, 96px); font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -.02em; }
.timer-ring { position: relative; width: min(260px, 70vw); aspect-ratio: 1; margin: 0 auto; }
.timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-ring .big-time { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(44px, 10vw, 64px); }
.preset-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.plates { display: flex; align-items: center; justify-content: center; gap: 3px; min-height: 120px; padding: 10px 0; }
.plate { border-radius: 4px; display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700; writing-mode: vertical-rl; }
.bar-sleeve { width: 60px; height: 14px; background: var(--surface-3); border-radius: 3px; }

/* ---------- Ernährung ---------- */
.date-nav { display: flex; align-items: center; gap: 6px; }
.date-nav b { min-width: 128px; text-align: center; font-weight: 700; }
.diary-sum { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
.diary-sum .grow { min-width: 240px; }
.meal { padding: 0; overflow: hidden; }
.meal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.meal-head h2 { font-size: 16px; }
.meal-kcal { font-weight: 700; font-variant-numeric: tabular-nums; }
.meal .li { padding: 11px 18px; }
.meal-foot { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; }
.meal-add { color: var(--accent-mark); }
.water { display: flex; gap: 6px; flex-wrap: wrap; }
.glass { width: 34px; height: 42px; border-radius: 6px 6px 10px 10px; border: 2px solid var(--line-strong); background: transparent; position: relative; overflow: hidden; padding: 0; }
.glass::after { content: ""; position: absolute; inset: auto 0 0 0; height: 0; background: var(--s1); opacity: .75; transition: height .25s ease-out; }
.glass.full::after { height: 78%; }
.food-detail .big { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
.nutri-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; text-align: center; }
.nutri-grid div { background: var(--surface-2); border-radius: 12px; padding: 10px 4px; }
.nutri-grid b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.nutri-grid span { font-size: 12px; color: var(--muted); }
.scan-box { position: relative; border-radius: 16px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; }
.scan-box video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scan-box .scan-line { position: absolute; left: 10%; right: 10%; top: 50%; height: 2px; background: var(--accent); box-shadow: 0 0 12px 2px var(--accent); animation: scan 1.6s ease-in-out infinite alternate; }
.scan-box .scan-frame { position: absolute; inset: 28% 8%; border: 2px solid rgba(255, 255, 255, .7); border-radius: 12px; }
@keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(40px); } }
.ntable { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.ntable th, .ntable td { padding: 9px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.ntable th:first-child, .ntable td:first-child { text-align: left; }
.ntable th { font-size: 12px; color: var(--muted); font-weight: 600; }
.split-bar { display: flex; height: 16px; border-radius: 6px; overflow: hidden; gap: 2px; }
.split-bar span { display: block; height: 100%; }

/* ---------- Laufen ---------- */
.live { text-align: center; }
.live-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 18px 0; }
.live-grid div { background: var(--surface-2); border-radius: 16px; padding: 14px 8px; }
.live-grid b { display: block; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.live-grid span { font-size: 12px; color: var(--muted); font-weight: 600; }
.route { width: 100%; height: 160px; border-radius: 14px; background: var(--surface-2); }
.route path { fill: none; stroke: var(--accent-mark); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.route circle { fill: var(--accent-mark); stroke: var(--surface); stroke-width: 2; }
.mini-route { width: 44px; height: 44px; border-radius: 10px; background: var(--surface-2); flex: none; }
.mini-route path { fill: none; stroke: var(--accent-mark); stroke-width: 2.4; stroke-linecap: round; }
.gps { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.gps i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.gps.ok i { background: var(--good); }
.gps.weak i { background: #fab219; }

/* ---------- Zuhause ---------- */
.remote-frame { width: 100%; height: min(820px, 78vh); border: 0; border-radius: 16px; background: #0E1424; display: block; }
.devices { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.device {
  display: flex; flex-direction: column; gap: 14px; align-items: flex-start; text-align: left;
  padding: 14px; min-height: 112px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--ink); transition: background .18s ease-out, box-shadow .18s ease-out;
}
.device .di { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--surface-3); color: var(--muted); }
.device b { font-weight: 600; font-size: 14px; display: block; }
.device small { color: var(--muted); font-size: 12px; }
.device.on { background: var(--surface); box-shadow: 0 0 0 1px var(--accent), 0 10px 30px -14px var(--glow); }
.device.on .di { background: var(--accent); color: var(--accent-ink); }
.device.planned { border-style: dashed; background: transparent; }
.room h2 { font-family: var(--serif); font-size: 21px; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: var(--ink-2); }

/* ---------- Bottom-Sheet / Dialog ---------- */
.sheet {
  border: 0; padding: 0; color: var(--ink); background: var(--surface);
  width: min(580px, 100vw); max-width: 100vw; max-height: 90vh;
  border-radius: 24px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .5);
}
.sheet::backdrop { background: rgba(9, 13, 24, .55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.sheet[open] { animation: sheetIn .22s ease-out; }
@keyframes sheetIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.sheet-inner { padding: 22px; display: flex; flex-direction: column; gap: 16px; max-height: 90vh; overflow-y: auto; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-head h2 { font-family: var(--serif); font-size: 22px; }
.sheet-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
@media (max-width: 640px) {
  .sheet { margin: auto 0 0; width: 100vw; border-radius: 24px 24px 0 0; max-height: 94vh; }
  .sheet-inner { max-height: 94vh; padding: 18px 16px calc(22px + env(safe-area-inset-bottom)); }
  .sheet-actions .btn { flex: 1; }
}

/* Hinweis-Toast */
.toast {
  position: fixed; z-index: 90; left: 50%; top: calc(16px + env(safe-area-inset-top));
  transform: translate(-50%, -140%); opacity: 0;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
  transition: transform .25s ease-out, opacity .25s ease-out; max-width: calc(100vw - 32px);
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media print { .side, .timer-pill { display: none; } .app { display: block; } }

<script>
'use strict';
/* =====================================================================
   Grundbausteine: Hilfsfunktionen, Speicher, Sync, Router, Dialoge
   ===================================================================== */

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const clone = v => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sum = arr => arr.reduce((a, b) => a + (+b || 0), 0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (name, cls) => `<svg class="ic ${cls || ''}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };

/* ---------- Zahlen und Zeiten (deutsch formatiert) ---------- */
const NF = {};
function fmt(n, d) {
  d = d || 0;
  if (!NF[d]) NF[d] = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: d });
  return NF[d].format(n || 0);
}
function fmtFixed(n, d) { return new Intl.NumberFormat('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d }).format(n || 0); }
function fmtDur(sec, withHours) {
  sec = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const pad = x => String(x).padStart(2, '0');
  return (h || withHours) ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}
function fmtMin(sec) {
  const m = Math.round((sec || 0) / 60);
  return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`;
}
function fmtPace(secPerKm) {
  if (!secPerKm || !isFinite(secPerKm)) return '–';
  const m = Math.floor(secPerKm / 60), s = Math.round(secPerKm % 60);
  return s === 60 ? `${m + 1}:00` : `${m}:${String(s).padStart(2, '0')}`;
}
function parseDur(str) {
  const p = String(str || '').trim().split(':').map(x => num(x));
  if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];
  if (p.length === 2) return p[0] * 60 + p[1];
  return p[0] * 60; // nur Minuten
}

/* ---------- Datum: lokale Tagesschlüssel YYYY-MM-DD ---------- */
const pad2 = n => String(n).padStart(2, '0');
function dkey(d) { d = d ? new Date(d) : new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
const todayKey = () => dkey();
function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(k, n) { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); }
function weekStart(k) { const d = parseKey(k || todayKey()); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return dkey(d); }
const monthOf = k => k.slice(0, 7);
const DAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const DAYS_LONG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const MONTHS = ['Jan.', 'Feb.', 'März', 'Apr.', 'Mai', 'Juni', 'Juli', 'Aug.', 'Sept.', 'Okt.', 'Nov.', 'Dez.'];
const MONTHS_LONG = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
function fmtDate(k, opts) {
  const d = typeof k === 'string' ? parseKey(k) : new Date(k);
  const t = todayKey(), key = dkey(d);
  if (!(opts && opts.plain)) {
    if (key === t) return 'Heute';
    if (key === addDays(t, -1)) return 'Gestern';
    if (key === addDays(t, 1)) return 'Morgen';
  }
  const base = `${d.getDate()}. ${MONTHS[d.getMonth()]}`;
  const withYear = d.getFullYear() !== new Date().getFullYear();
  return (opts && opts.day ? DAYS[d.getDay()] + ', ' : '') + base + (withYear ? ' ' + d.getFullYear() : '');
}
function fmtTime(ts) { const d = new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function daysBetween(a, b) { return Math.round((parseKey(b) - parseKey(a)) / 864e5); }

/* =====================================================================
   Speicher: Schlüssel-Wert-Ablage in localStorage, gespiegelt in die
   Claude-Datenbank (falls die Seite als Artifact läuft).
   Daten sind in Monats-Eimer aufgeteilt (w-2026-11, n-2026-11, r-2026-11),
   damit kein Dokument zu groß wird.
   ===================================================================== */
const LS = 'zh:';
const LOCAL = 'zh-local:';   // nur auf diesem Gerät (Timer, Token, Ansicht)
let lsOk = true;
try { localStorage.setItem('zh-test', '1'); localStorage.removeItem('zh-test'); } catch (e) { lsOk = false; }
function lsRead(k) { if (!lsOk) return undefined; try { const v = localStorage.getItem(k); return v == null ? undefined : JSON.parse(v); } catch (e) { return undefined; } }
function lsWrite(k, v) { if (!lsOk) return; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('Speicher voll – bitte Daten exportieren'); } }
const Local = {
  mem: {},
  get(k, def) { if (!(k in this.mem)) { const v = lsRead(LOCAL + k); this.mem[k] = v === undefined ? def : v; } return this.mem[k]; },
  set(k, v) { this.mem[k] = v; lsWrite(LOCAL + k, v); }
};

const Store = {
  mem: {},
  meta: lsRead(LS + '__meta') || {},
  get(key, def) {
    if (!(key in this.mem)) {
      const v = lsRead(LS + key);
      this.mem[key] = v === undefined ? clone(def) : v;
    }
    return this.mem[key];
  },
  set(key, val) {
    this.mem[key] = val;
    this.meta[key] = Date.now();
    lsWrite(LS + key, val);
    lsWrite(LS + '__meta', this.meta);
    Sync.push(key);
  },
  applyRemote(key, val, t) {
    this.mem[key] = val;
    this.meta[key] = t;
    lsWrite(LS + key, val);
    lsWrite(LS + '__meta', this.meta);
  },
  keys(prefix) { return Object.keys(this.meta).filter(k => !prefix || k.indexOf(prefix) === 0).sort(); },
  exportAll() { const out = {}; this.keys().forEach(k => { out[k] = this.get(k); }); return out; },
  importAll(data) { Object.keys(data).forEach(k => { if (/^[a-z][a-z0-9-]*$/i.test(k)) this.set(k, data[k]); }); },
  clearAll() { this.keys().forEach(k => this.set(k, null)); }
};

/* Sync über die Claude-Datenbank: jeder Eimer ist ein Dokument unter
   data/users/<id>/<schlüssel> mit {v: Wert, t: Zeitstempel}. Neuere Zeit gewinnt. */
const Sync = {
  col: null, state: 'local', pending: {}, writing: {}, again: {}, first: true,
  async init() {
    renderSyncState();
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.col = db.collection('data/users/' + id);
    } catch (e) { return; }
    this.state = 'connecting'; renderSyncState();
    const timer = setTimeout(() => { if (this.state === 'connecting') { this.state = 'offline'; renderSyncState(); } }, 10000);
    this.col.onSnapshot(snap => {
      if (!snap.metadata.fromCache) { clearTimeout(timer); this.state = 'synced'; }
      let changed = false;
      const remote = {};
      snap.docs.forEach(d => {
        const body = d.data();
        if (!body || typeof body.t !== 'number') return;
        remote[d.id] = body.t;
        if (body.t > (Store.meta[d.id] || 0)) { Store.applyRemote(d.id, clone(body.v), body.t); changed = true; }
      });
      if (this.first && !snap.metadata.fromCache) {
        this.first = false;
        Store.keys().forEach(k => { if ((Store.meta[k] || 0) > (remote[k] || 0)) this.push(k, true); });
      }
      renderSyncState();
      if (changed) { Bus.emit('data'); rerender(); }
    }, () => { clearTimeout(timer); this.state = 'error'; renderSyncState(); });
  },
  push(key, now) {
    if (!this.col) return;
    clearTimeout(this.pending[key]);
    this.pending[key] = setTimeout(() => this.write(key), now ? 50 : 1200);
  },
  async write(key) {
    if (this.writing[key]) { this.again[key] = true; return; }
    this.writing[key] = true;
    try {

function bucketList(prefix) {
  let out = [];
  Store.keys(prefix).forEach(k => { const v = Store.get(k); if (Array.isArray(v)) out = out.concat(v); });
  return out;
}
function upsertBucket(prefix, item, dateField) {
  const key = prefix + monthOf(dkey(item[dateField]));
  // ggf. aus anderem Monat entfernen (Datum geändert)
  Store.keys(prefix).forEach(k => {
    if (k === key) return;
    const arr = Store.get(k);
    if (Array.isArray(arr) && arr.some(x => x.id === item.id)) Store.set(k, arr.filter(x => x.id !== item.id));
  });
  const arr = (Store.get(key, []) || []).slice();
  const i = arr.findIndex(x => x.id === item.id);
  if (i >= 0) arr[i] = item; else arr.push(item);
  Store.set(key, arr);
}
function removeFromBuckets(prefix, id) {
  Store.keys(prefix).forEach(k => {
    const arr = Store.get(k);
    if (Array.isArray(arr) && arr.some(x => x.id === id)) Store.set(k, arr.filter(x => x.id !== id));
  });
}
const Workouts = {
  all() { return bucketList('w-').sort((a, b) => b.start - a.start); },
  get(id) { return this.all().find(w => w.id === id); },
  save(w) { upsertBucket('w-', w, 'start'); },
  remove(id) { removeFromBuckets('w-', id); }
};
const Runs = {
  all() { return bucketList('r-').sort((a, b) => b.start - a.start); },
  get(id) { return this.all().find(r => r.id === id); },
  save(r) { upsertBucket('r-', r, 'start'); },
  remove(id) { removeFromBuckets('r-', id); }
};
const MEALS = [
  { id: 'b', name: 'Frühstück' },
  { id: 'l', name: 'Mittagessen' },
  { id: 'd', name: 'Abendessen' },
  { id: 's', name: 'Snacks' }
];
const Diary = {
  day(k) {
    const m = Store.get('n-' + monthOf(k), {}) || {};
    const d = m[k] ? clone(m[k]) : {};
    d.meals = d.meals || {};
    MEALS.forEach(x => { d.meals[x.id] = d.meals[x.id] || []; });
    d.water = d.water || 0;
    return d;
  },
  saveDay(k, d) {
    const key = 'n-' + monthOf(k);
    const m = Object.assign({}, Store.get(key, {}) || {});
    m[k] = d;
    Store.set(key, m);
  },
  totals(d) {
    const t = { kcal: 0, p: 0, c: 0, f: 0, fib: 0, sug: 0, salt: 0 };
    MEALS.forEach(x => d.meals[x.id].forEach(e => { Object.keys(t).forEach(n => { t[n] += +e[n] || 0; }); }));
    return t;
  },
  hasEntries(k) { const m = Store.get('n-' + monthOf(k), {}) || {}; const d = m[k]; return !!(d && d.meals && MEALS.some(x => (d.meals[x.id] || []).length)); }

const Body = {
  all() { return (Store.get('body', []) || []).slice().sort((a, b) => a.d < b.d ? -1 : 1); },
  latest() { const a = this.all(); return a[a.length - 1]; },
  set(d, kg) { const a = (Store.get('body', []) || []).filter(x => x.d !== d); if (kg) a.push({ d, kg }); Store.set('body', a); },
  weightOr(def) { const l = this.latest(); return l ? l.kg : def; }
};

/* Kalorienverbrauch durch Training an einem Tag (Schätzung über MET-Werte) */
function exerciseKcal(k) {
  const kg = Body.weightOr(80);
  let kcal = 0;
  Workouts.all().forEach(w => { if (dkey(w.start) === k && w.end) kcal += 5.0 * kg * ((w.end - w.start) / 3600e3); });
  Runs.all().forEach(r => { if (dkey(r.start) === k) kcal += r.km * kg * 1.0; });
  return Math.round(kcal);
}

/* ---------- Töne und Vibration ---------- */
const Beep = {
  ctx: null,
  unlock() {
    if (this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { this.ctx = new C(); const b = this.ctx.createBuffer(1, 1, 22050); const s = this.ctx.createBufferSource(); s.buffer = b; s.connect(this.ctx.destination); s.start(0); } catch (e) { this.ctx = null; }
  },
  play(times, freq) {
    if (!this.ctx) return;
    times = times || 3;
    const now = this.ctx.currentTime;
    for (let i = 0; i < times; i++) {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.frequency.value = freq || (i === times - 1 ? 1175 : 880);
      o.type = 'sine';
      g.gain.setValueAtTime(0.0001, now + i * 0.28);
      g.gain.exponentialRampToValueAtTime(0.35, now + i * 0.28 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.28 + 0.22);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(now + i * 0.28); o.stop(now + i * 0.28 + 0.25);
    }
  },
  buzz(p) { if (navigator.vibrate) { try { navigator.vibrate(p || [180, 90, 180]); } catch (e) { /* nicht unterstützt */ } } }
};
document.addEventListener('pointerdown', () => Beep.unlock(), { once: true, capture: true });

/* =====================================================================
   Pausentimer: läuft seitenübergreifend als schwebende Pille
   ===================================================================== */
const RestTimer = {
  st: Local.get('timer', null),     // {end, total, label}
  iv: null, doneUntil: 0,
  start(sec, label) {
    this.st = { end: Date.now() + sec * 1000, total: sec, label: label || 'Pause' };
    Local.set('timer', this.st);
    this.doneUntil = 0;
    this.run();
  },
  add(sec) {
    if (!this.st) return;
    this.st.end += sec * 1000; this.st.total = Math.max(1, this.st.total + sec);
    if (this.st.end < Date.now()) return this.stop();
    Local.set('timer', this.st); this.paint();
  },
  stop() { this.st = null; Local.set('timer', null); this.paint(); },
  remaining() { return this.st ? Math.max(0, (this.st.end - Date.now()) / 1000) : 0; },
  run() {
    clearInterval(this.iv);
    this.iv = setInterval(() => this.tick(), 250);
    this.tick();
  },
  tick() {
    if (this.st && this.remaining() <= 0) {
      this.st = null; Local.set('timer', null);
      this.doneUntil = Date.now() + 5000;
      Beep.play(3); Beep.buzz();
      if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
        try { new Notification('Pause vorbei', { body: 'Weiter mit dem nächsten Satz!' }); } catch (e) { /* ok */ }
      }
    }
    if (!this.st && Date.now() > this.doneUntil) { clearInterval(this.iv); this.iv = null; }
    this.paint();
  },
  paint() {
    const el = $('#timerPill');
    const done = !this.st && Date.now() < this.doneUntil;
    if (!this.st && !done) { el.hidden = true; Bus.emit('timer'); return; }
    el.hidden = false;
    el.classList.toggle('done', done);
    if (done) {
      el.innerHTML = `${icon('check')}<b style="min-width:auto">Pause vorbei</b><button data-act="timerStop" aria-label="Schließen">${icon('x', 'ic-s')}</button>`;
    } else {
      const r = this.remaining();
      el.innerHTML = `<span class="tiny">${esc(this.st.label)}</span><b>${fmtDur(Math.ceil(r))}</b>
        <span class="tp-bar"><span style="width:${clamp(100 - r / this.st.total * 100, 0, 100)}%"></span></span>
        <button data-act="timerAdd" data-sec="-15" aria-label="15 Sekunden weniger">−15</button>
        <button data-act="timerAdd" data-sec="15" aria-label="15 Sekunden mehr">+15</button>
        <button data-act="timerStop" aria-label="Timer beenden">${icon('x', 'ic-s')}</button>`;
    }
    Bus.emit('timer');
  }
};

/* =====================================================================
   Diagramme: schlanke SVG-Linien- und Balkendiagramme mit Hover-Tooltip
   ===================================================================== */
const Tip = {
  show(html, x, y) {
    const t = $('#tooltip');
    t.innerHTML = html; t.hidden = false;
    const r = t.getBoundingClientRect();
    let left = x + 14, top = y - r.height - 12;
    if (left + r.width > window.innerWidth - 8) left = x - r.width - 14;
    if (top < 8) top = y + 16;
    t.style.left = Math.max(8, left) + 'px'; t.style.top = top + 'px';
  },
  hide() { $('#tooltip').hidden = true; }
};
window.addEventListener('scroll', () => Tip.hide(), { passive: true });

function niceTicks(min, max, count) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, step0 = span / Math.max(1, count);
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0 / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(10));
  return { lo, hi, ticks };
}

const Charts = {
  specs: [], n: 0,
  reset() { this.specs = []; },
  slot(spec) {
    const id = 'ch' + (++this.n);
    spec.id = id;
    this.specs.push(spec);
    const h = spec.height || 220;
    return `<div class="chart" id="${id}" style="min-height:${h}px" role="img" aria-label="${esc(spec.label || 'Diagramm')}"></div>`;
  },
  drawAll() { this.specs.forEach(s => this.draw(s)); },
  draw(s) {
    const el = document.getElementById(s.id);
    if (!el) return;
    const W = Math.max(240, el.clientWidth);
    if (s.type === 'line') this.line(el, s, W);
    else if (s.type === 'bars') this.bars(el, s, W);
  },

  line(el, s, W) {
    const pts = (s.points || []).filter(p => isFinite(p.y));
    const H = s.height || 220;
    if (!pts.length) { el.innerHTML = `<div class="chart-empty" style="min-height:${H}px">${s.empty || 'Noch keine Daten'}</div>`; return; }
    const pl = 46, pr = 14, pt = 14, pb = 28;
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    let x0 = Math.min(...xs), x1 = Math.max(...xs);
    if (x0 === x1) { x0 -= 864e5 * 3; x1 += 864e5 * 3; }
    let yMin = Math.min(...ys), yMax = Math.max(...ys);
    const padY = (yMax - yMin) * 0.12 || Math.abs(yMax) * 0.05 || 1;
    if (s.zero) yMin = 0; else yMin -= padY;
    yMax += padY;
    const nt = niceTicks(yMin, yMax, 4);
    const lo = s.zero ? 0 : nt.lo, hi = nt.hi;
    const X = x => pl + (x - x0) / (x1 - x0) * (W - pl - pr);
    const Y = y => s.invert ? pt + (y - lo) / (hi - lo) * (H - pt - pb) : H - pb - (y - lo) / (hi - lo) * (H - pt - pb);
    const yFmt = s.yFmt || (v => fmt(v, 1));
    let g = '';
    nt.ticks.filter(t => t >= lo && t <= hi).forEach(t => {
      g += `<line class="gridline" x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}"/>`;
      g += `<text x="${pl - 8}" y="${Y(t) + 4}" text-anchor="end">${esc(yFmt(t))}</text>`;
    });
    // x-Achse: Datumsbeschriftungen gleichmäßig verteilt
    const nx = Math.max(2, Math.min(6, Math.floor((W - pl - pr) / 90)));
    for (let i = 0; i < nx; i++) {
      const t = x0 + (x1 - x0) * i / (nx - 1);
      const anchor = i === 0 ? 'start' : i === nx - 1 ? 'end' : 'middle';
      g += `<text x="${X(t)}" y="${H - 8}" text-anchor="${anchor}">${esc((s.xFmt || (v => fmtDate(v, { plain: true })))(t))}</text>`;
    }
    const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
    const base = s.invert ? pt : H - pb;
    const area = s.area !== false && pts.length > 1 ? `<path class="area" d="${d} L${X(pts[pts.length - 1].x).toFixed(1)} ${base} L${X(pts[0].x).toFixed(1)} ${base} Z"/>` : '';
    const dots = pts.length <= 45 ? pts.map(p => `<circle class="pt" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4"/>`).join('') : '';
    let goal = '';
    if (s.goal != null && s.goal >= lo && s.goal <= hi) {
      goal = `<line class="goal" x1="${pl}" x2="${W - pr}" y1="${Y(s.goal)}" y2="${Y(s.goal)}"/><text class="goal-label" x="${W - pr}" y="${Y(s.goal) - 6}" text-anchor="end">${esc(s.goalLabel || 'Ziel')}</text>`;
    }
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${g}<line class="baseline" x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}"/>${goal}${area}<path class="line" d="${d}"/>${dots}
      <line class="cross" y1="${pt}" y2="${H - pb}" visibility="hidden"/><circle class="hot" r="6" visibility="hidden"/>
      <rect class="hit" x="${pl}" y="0" width="${W - pl - pr}" height="${H}"/></svg>`;
    const svg = el.firstChild, cross = $('.cross', svg), hot = $('.hot', svg);
    const move = e => {
      const r = svg.getBoundingClientRect();
      const mx = (e.clientX - r.left) * (W / r.width);
      let best = pts[0], bd = Infinity;
      pts.forEach(p => { const dd = Math.abs(X(p.x) - mx); if (dd < bd) { bd = dd; best = p; } });
      const cx = X(best.x), cy = Y(best.y);
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
      hot.setAttribute('cx', cx); hot.setAttribute('cy', cy); hot.setAttribute('visibility', 'visible');
      Tip.show(best.tip || `<b>${esc(yFmt(best.y))}</b><br>${esc(fmtDate(best.x, { plain: true, day: true }))}`, r.left + cx * r.width / W, r.top + cy * r.height / H);
    };
    const leave = () => { cross.setAttribute('visibility', 'hidden'); hot.setAttribute('visibility', 'hidden'); Tip.hide(); };
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerdown', move);
    svg.addEventListener('pointerleave', leave);
  },

  bars(el, s, W) {
    const bars = s.bars || [];
    const H = s.height || 200;
    if (!bars.length || bars.every(b => !b.value) && !s.showEmpty) { el.innerHTML = `<div class="chart-empty" style="min-height:${H}px">${s.empty || 'Noch keine Daten'}</div>`; return; }
    const pl = 40, pr = 10, pt = 16, pb = 26;
    const maxV = Math.max(...bars.map(b => b.value), s.goal || 0) * 1.08 || 1;
    const nt = niceTicks(0, maxV, 3);
    const hi = nt.hi;
    const band = (W - pl - pr) / bars.length;
    const bw = Math.min(38, band * 0.62);
    const Y = v => H - pb - v / hi * (H - pt - pb);
    const yFmt = s.yFmt || (v => fmt(v));
    let g = '';
    nt.ticks.forEach(t => {
      g += `<line class="gridline" x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl - 8}" y="${Y(t) + 4}" text-anchor="end">${esc(yFmt(t))}</text>`;
    });
    const every = Math.ceil(bars.length / Math.max(1, Math.floor((W - pl - pr) / 44)));
    let marks = '', labels = '', hits = '';
    bars.forEach((b, i) => {
      const cx = pl + band * i + band / 2, x = cx - bw / 2, y = Y(b.value), h = H - pb - y;
      if (b.value > 0) {
        const r = Math.min(4, h, bw / 2);
        marks += `<path class="bar-mark${b.dim ? ' dim' : ''}${b.over ? ' over' : ''}" d="M${x} ${H - pb} V${y + r} Q${x} ${y} ${x + r} ${y} H${x + bw - r} Q${x + bw} ${y} ${x + bw} ${y + r} V${H - pb} Z"/>`;
      }
      if (i % every === 0 || i === bars.length - 1 && bars.length < 10) labels += `<text x="${cx}" y="${H - 8}" text-anchor="middle"${b.strong ? ' style="fill:var(--ink);font-weight:700"' : ''}>${esc(b.label)}</text>`;
      hits += `<rect class="hit" data-i="${i}" x="${pl + band * i}" y="0" width="${band}" height="${H - pb + 4}"/>`;
    });
    let goal = '';
    if (s.goal) goal = `<line class="goal" x1="${pl}" x2="${W - pr}" y1="${Y(s.goal)}" y2="${Y(s.goal)}"/><text class="goal-label" x="${W - pr}" y="${Y(s.goal) - 6}" text-anchor="end">${esc(s.goalLabel || 'Ziel')}</text>`;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${g}${marks}<line class="baseline" x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}"/>${goal}${labels}${hits}</svg>`;
    const svg = el.firstChild;
    const show = e => {
      const t = e.target.closest('.hit');
      if (!t) return;
      const b = bars[+t.dataset.i];
      const r = svg.getBoundingClientRect();
      const cx = pl + band * +t.dataset.i + band / 2;
      Tip.show(b.tip || `<b>${esc(yFmt(b.value))}</b><br>${esc(b.label)}`, r.left + cx * r.width / W, r.top + Y(b.value) * r.height / H);
    };
    svg.addEventListener('pointermove', show);
    svg.addEventListener('pointerdown', show);
    svg.addEventListener('pointerleave', () => Tip.hide());
  }
};

/* Fortschrittsring (Kalorien, Ziele) */
function ring(frac, center, label, opts) {
  opts = opts || {};
  const r = 44, c = 2 * Math.PI * r, f = clamp(frac, 0, 1);
  return `<div class="ring-wrap ${opts.small ? 'ring-s' : ''}" role="img" aria-label="${esc(opts.aria || label)}">
    <svg viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="${r}" fill="none" stroke-width="${opts.small ? 9 : 8}"/>
    <circle class="ring-fg${opts.over ? ' over' : ''}" cx="50" cy="50" r="${r}" fill="none" stroke-width="${opts.small ? 9 : 8}" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - f)).toFixed(2)}"/></svg>
    <div class="ring-center"><b>${center}</b><span>${label}</span></div></div>`;
}

/* Kleine Verlaufslinie ohne Achsen */
function sparkline(values, w, h) {
  w = w || 120; h = h || 36;
  if (values.length < 2) return '';
  const mn = Math.min(...values), mx = Math.max(...values), sp = mx - mn || 1;
  const d = values.map((v, i) => `${i ? 'L' : 'M'}${(i / (values.length - 1) * (w - 4) + 2).toFixed(1)} ${(h - 3 - (v - mn) / sp * (h - 6)).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent-mark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* Waagrechte Balken mit direkter Beschriftung */
function hbars(items, fmtV) {
  const mx = Math.max(1, ...items.map(i => i.value));
  return `<div class="hbars">${items.map(i => `<div class="hbar"><span class="nowrap" style="overflow:hidden;text-overflow:ellipsis">${esc(i.label)}</span>
    <div class="hbar-track" title="${esc(i.label)}: ${esc((fmtV || fmt)(i.value))}"><span style="width:${(i.value / mx * 100).toFixed(1)}%"></span></div>
    <span class="hbar-val">${(fmtV || fmt)(i.value)}</span></div>`).join('')}</div>`;
}

/* Aktivitäts-Raster der letzten Wochen (Mo–So je Spalte) */
function heatmap(weeks, levelOf, tipOf) {
  const t = todayKey();
  const start = addDays(weekStart(t), -7 * (weeks - 1));
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const k = addDays(start, i);
    if (k > t) { cells += '<i style="visibility:hidden"></i>'; continue; }
    cells += `<i data-l="${levelOf(k)}" class="${k === t ? 'today' : ''}" data-tip="${esc(tipOf(k))}"></i>`;
  }
  return `<div class="heat" data-heat style="grid-template-columns:repeat(${weeks}, minmax(0, 1fr));max-width:${weeks * 24}px">${cells}</div>`;
}
document.addEventListener('pointerover', e => {
  const c = e.target.closest('.heat i[data-tip]');
  if (c) { const r = c.getBoundingClientRect(); Tip.show(c.dataset.tip, r.left + r.width / 2, r.top); }
});
document.addEventListener('pointerout', e => { if (e.target.closest('.heat i[data-tip]')) Tip.hide(); });

const Foods = {
  lib() { return Store.get('foods', { custom: [], recent: [], cache: {} }) || { custom: [], recent: [], cache: {} }; },
  save(lib) { Store.set('foods', lib); },
  get(id) {
    const lib = this.lib();
    return FOOD_BASE.find(f => f.id === id) || lib.custom.find(f => f.id === id) || Object.values(lib.cache).find(f => f.id === id);
  },
  addCustom(food) { const lib = this.lib(); food.id = food.id || 'u-' + uid(); food.src = 'custom'; lib.custom = lib.custom.filter(f => f.id !== food.id).concat([food]); this.save(lib); return food; },
  removeCustom(id) { const lib = this.lib(); lib.custom = lib.custom.filter(f => f.id !== id); this.save(lib); },
  cacheProduct(food) {
    const lib = this.lib();
    lib.cache = Object.assign({}, lib.cache);
    lib.cache[food.id] = food;
    const ids = Object.keys(lib.cache);
    if (ids.length > 250) ids.slice(0, ids.length - 250).forEach(k => { if (!lib.recent.includes(k)) delete lib.cache[k]; });
    this.save(lib);
  },
  touch(id) {
    const lib = this.lib();
    lib.recent = [id].concat((lib.recent || []).filter(x => x !== id)).slice(0, 40);
    this.save(lib);
  },
  recent() { return (this.lib().recent || []).map(id => this.get(id)).filter(Boolean); },
  search(q) {
    q = q.trim().toLowerCase();
    if (!q) return [];
    const lib = this.lib();
    const pool = lib.custom.concat(Object.values(lib.cache), FOOD_BASE);
    const words = q.split(/\s+/);
    return pool.filter(f => words.every(w => (f.name + ' ' + (f.brand || '')).toLowerCase().includes(w)))
      .sort((a, b) => (a.name.toLowerCase().startsWith(q) ? 0 : 1) - (b.name.toLowerCase().startsWith(q) ? 0 : 1))
      .slice(0, 30);
  }
};
function scaleFood(food, grams) {
  const k = grams / 100, o = {};
  NUTRIENTS.forEach(([n]) => { o[n] = Math.round((+food[n] || 0) * k * 10) / 10; });
  o.kcal = Math.round(o.kcal);
  return o;
}

/* ---------- Auswertungen ---------- */
function exHistory(exId) {
  const out = [];
  Workouts.all().slice().reverse().forEach(w => {
    w.items.filter(it => it.ex === exId).forEach(it => {
      const sets = it.sets.filter(s => s.type !== 'w');
      if (!sets.length) return;
      const best = sets.reduce((b, s) => e1rm(+s.kg, +s.reps) > e1rm(+b.kg, +b.reps) ? s : b, sets[0]);
      out.push({
        w, date: w.start, sets: it.sets,
        e1rm: e1rm(+best.kg, +best.reps), best,
        topKg: Math.max(...sets.map(s => +s.kg || 0)),
        topReps: Math.max(...sets.map(s => +s.reps || 0)),
        volume: sum(sets.map(s => (+s.kg || 0) * (+s.reps || 0)))
      });
    });
  });
  return out;
}
function prEvents() {
  const best = {}, ev = [];
  Workouts.all().slice().reverse().forEach(w => {
    w.items.forEach(it => {
      it.sets.forEach(s => {
        if (s.type === 'w') return;
        const v = e1rm(+s.kg, +s.reps);
        if (!v) return;
        if (best[it.ex] && v > best[it.ex] + 0.01) ev.push({ w: w.id, ex: it.ex, v, date: w.start, s });
        if (!best[it.ex] || v > best[it.ex]) best[it.ex] = v;
      });
    });
  });
  return ev;
}
function bestE1rm(exId, excludeId) {
  let b = 0;
  Workouts.all().forEach(w => { if (w.id === excludeId) return; w.items.forEach(it => { if (it.ex === exId) it.sets.forEach(s => { if (s.type !== 'w') b = Math.max(b, e1rm(+s.kg, +s.reps)); }); }); });
  return b;
}
function prevSets(exId) {
  const w = Workouts.all().find(w => w.items.some(it => it.ex === exId && it.sets.length));
  if (!w) return [];
  return w.items.find(it => it.ex === exId).sets;
}
function workoutsInRange(fromKey, toKey) { return Workouts.all().filter(w => { const k = dkey(w.start); return k >= fromKey && k <= toKey; }); }
function muscleSets(days) {
  const from = addDays(todayKey(), -(days - 1));
  const m = {};
  workoutsInRange(from, todayKey()).forEach(w => w.items.forEach(it => {
    const n = it.sets.filter(s => s.type !== 'w').length;
    const mg = Exercises.get(it.ex).m;
    m[mg] = (m[mg] || 0) + n;
  }));
  return Object.keys(m).map(k => ({ label: MUSCLES[k] || k, value: m[k] })).sort((a, b) => b.value - a.value);
}

/* ---------- Verlauf ---------- */
function renderHistory() {
  const ws = Workouts.all();
  if (!ws.length) return `<div class="card">${emptyState('calendar', 'Noch keine Trainings gespeichert.', `<button class="btn btn-primary" data-act="woStartEmpty">Training starten</button>`)}</div>`;
  const prs = prEvents();
  const groups = {};
  ws.forEach(w => { const k = monthOf(dkey(w.start)); (groups[k] = groups[k] || []).push(w); });
  return Object.keys(groups).sort().reverse().map(k => {
    const [y, m] = k.split('-').map(Number);

function renderTrainingDash() {
  const s = settings();
  const t = todayKey(), ws = weekStart(t);
  const thisWeek = workoutsInRange(ws, t);
  const last7 = workoutsInRange(addDays(t, -6), t), prev7 = workoutsInRange(addDays(t, -13), addDays(t, -7));
  const vol7 = sum(last7.map(woVolume)), volPrev = sum(prev7.map(woVolume));
  const delta = volPrev ? (vol7 - volPrev) / volPrev * 100 : 0;
  const prs30 = prEvents().filter(p => dkey(p.date) >= addDays(t, -29));
  const prEx30 = new Set(prs30.map(p => p.w + p.ex)).size;
  // Wochenserie: Wochen in Folge mit erreichtem Ziel (laufende Woche zählt, wenn erreicht)
  let streak = 0;
  for (let i = 0; i < 104; i++) {
    const a = addDays(ws, -7 * i), b = addDays(a, 6);
    const n = workoutsInRange(a, b).length;
    if (n >= s.weekGoal) streak++; else if (i > 0) break;
  }
  // Kraftverlauf
  const freq = {};
  Workouts.all().forEach(w => w.items.forEach(it => { freq[it.ex] = (freq[it.ex] || 0) + 1; }));
  const exIds = Object.keys(freq).sort((a, b) => freq[b] - freq[a]);
  if (!kv.ex || !freq[kv.ex]) kv.ex = exIds[0] || '';
  const hist = kv.ex ? exHistory(kv.ex).filter(x => !kv.range || dkey(x.date) >= addDays(t, -kv.range)) : [];
  const bw = hist.length && hist.every(x => !x.topKg);
  const metric = bw ? 'reps' : kv.metric;
  const pts = hist.map(x => {
    const y = metric === 'e1rm' ? Math.round(x.e1rm * 10) / 10 : metric === 'top' ? x.topKg : metric === 'vol' ? x.volume : x.topReps;
    const unit = metric === 'reps' ? ' Wdh.' : ' kg';
    return { x: x.date, y, tip: `<b>${fmt(y, 1)}${unit}</b> ${metric === 'e1rm' ? '1RM' : metric === 'vol' ? 'Volumen' : ''}<br>Bester Satz ${fmt(x.best.kg, 2)} kg × ${x.best.reps}<br>${esc(fmtDate(x.date, { plain: true, day: true }))}` };
  });
  const first = pts[0], last = pts[pts.length - 1];

  // Trainings pro Woche (12 Wochen)
  const weeks = [];
  for (let i = 11; i >= 0; i--) {
    const a = addDays(ws, -7 * i), b = addDays(a, 6);
    const n = workoutsInRange(a, b).length;

  }
  // Bestleistungen je Übung
  const bests = exIds.map(id => {
    const h = exHistory(id); const b = h.reduce((m, x) => x.e1rm > (m ? m.e1rm : 0) ? x : m, null);
    return b && b.e1rm ? { id, b } : null;
  }).filter(Boolean).sort((a, b) => b.b.e1rm - a.b.e1rm).slice(0, 7);
  const active = Active.get();
  const days = [];

  return `${active ? `<a class="banner" href="#/training/aktiv">${icon('gym')}<div class="grow">${esc(active.name)} läuft<small><span data-tick="wo">${fmtDur((Date.now() - active.start) / 1000)}</span> · tippe zum Weitermachen</small></div>${icon('right')}</a>` : ''}

    <button class="quick-btn" data-act="woStartEmpty"><span class="qi">${icon('plus')}</span><span>Leeres Training<small>frei loslegen</small></span></button>
    ${Templates.all().slice(0, 3).map(tp => `<button class="quick-btn" data-act="woStartTpl" data-id="${tp.id}"><span class="qi">${icon('play')}</span><span>${esc(tp.name)}<small>${tp.items.length} Übungen</small></span></button>`).join('')}
  </div>
  <div class="kpis">
    <div class="card"><div class="stat-label">Diese Woche</div><div class="stat-value">${thisWeek.length}<small>/ ${s.weekGoal}</small></div>
      <div class="week-dots" style="margin-top:10px">${days.map(d => `<div class="${d.k === t ? 'today' : ''}"><i class="${d.on ? 'on' : ''}" title="${fmtDate(d.k, { plain: true, day: true })}">${d.on ? icon('check', 'ic-s') : ''}</i>${DAYS[parseKey(d.k).getDay()]}</div>`).join('')}</div></div>
    <div class="card"><div class="stat-label">Volumen · 7 Tage</div><div class="stat-value">${fmt(vol7 / 1000, 1)}<small>t</small></div>
      <div class="stat-foot">${volPrev ? `<span class="${delta >= 0 ? 'delta-up' : 'delta-down'}">${delta >= 0 ? '▲' : '▼'} ${fmt(Math.abs(delta))} %</span> zur Vorwoche` : 'Vorwoche ohne Training'}</div></div>
    <div class="card"><div class="stat-label">Wochenserie</div><div class="stat-value">${streak}<small>${streak === 1 ? 'Woche' : 'Wochen'}</small></div><div class="stat-foot">mit ≥ ${s.weekGoal} Trainings</div></div>
    <div class="card"><div class="stat-label">Rekorde · 30 Tage</div><div class="stat-value">${prEx30}</div><div class="stat-foot">${fmtMin(sum(last7.map(woDuration)))} Training in 7 Tagen</div></div>
  </div>
  <div class="grid">
    <div class="card span-8"><div class="card-head wrap"><h2>${icon('chart')}Kraftverlauf</h2>
      <div class="row wrap">${exIds.length ? `<select class="input" style="min-height:34px;padding:4px 10px;font-size:14px;width:auto;max-width:240px" data-change="kvEx" aria-label="Übung wählen">${exIds.map(id => `<option value="${id}"${id === kv.ex ? ' selected' : ''}>${esc(Exercises.get(id).name)}</option>`).join('')}</select>` : ''}</div></div>

        <div class="seg" role="group" aria-label="Zeitraum">${[[90, '3 M'], [180, '6 M'], [365, '1 J'], [0, 'Alles']].map(([k, l]) => `<button class="${kv.range === k ? 'active' : ''}" data-act="kvRange" data-k="${k}">${l}</button>`).join('')}</div></div>
      ${pts.length > 1 ? `<p class="small muted" style="margin-bottom:6px">${change >= 0 ? `<span class="delta-up">+${fmt(change, 1)} %</span>` : `<span class="delta-down">${fmt(change, 1)} %</span>`} im Zeitraum · zuletzt <b style="color:var(--ink)">${fmt(last.y, 1)} ${metric === 'reps' ? 'Wdh.' : 'kg'}</b></p>` : ''}
      ${Charts.slot({ type: 'line', points: pts, label: 'Kraftverlauf', height: 240, yFmt: v => fmt(v, metric === 'vol' ? 0 : 1), empty: exIds.length ? 'Zu wenig Daten im Zeitraum' : 'Nach deinem ersten Training siehst du hier, wie du stärker wirst.' })}</div>
    <div class="card span-4"><div class="card-head"><h2>${icon('gym')}Sätze je Muskel</h2>
      <div class="seg">${[[7, '7 T'], [30, '30 T']].map(([k, l]) => `<button class="${muscleRange.d === k ? 'active' : ''}" data-act="muscleRange" data-k="${k}">${l}</button>`).join('')}</div></div>
      ${(() => { const m = muscleSets(muscleRange.d); return m.length ? hbars(m, v => fmt(v)) : '<p class="empty">Noch keine Sätze im Zeitraum.</p>'; })()}
      <p class="tiny muted" style="margin-top:12px">Arbeitssätze ohne Aufwärmen. Richtwert für Muskelaufbau: 10–20 Sätze je Muskel und Woche.</p></div>
    <div class="card span-6"><div class="card-head"><h2>${icon('calendar')}Trainings pro Woche</h2><span class="muted small">Ziel ${s.weekGoal}</span></div>
      ${Charts.slot({ type: 'bars', bars: weeks, goal: s.weekGoal, goalLabel: 'Ziel', height: 200, label: 'Trainings pro Woche', empty: 'Noch keine Trainings' })}</div>
    <div class="card span-6"><div class="card-head"><h2>${icon('trophy')}Bestleistungen</h2><a class="btn btn-ghost btn-s" href="#/training/uebungen">Alle</a></div>
      <div class="list">${bests.map(x => `<a class="li" href="#/training/uebung/${encodeURIComponent(x.id)}"><div class="li-main"><div class="li-title">${esc(Exercises.get(x.id).name)}</div><div class="li-sub">${fmt(x.b.best.kg, 2)} kg × ${x.b.best.reps} · ${fmtDate(x.b.date)}</div></div><div class="li-end">${fmt(x.b.e1rm, 1)} kg</div></a>`).join('') || '<p class="empty">Hier landen deine Rekorde.</p>'}</div></div>
    <div class="card span-12"><div class="card-head"><h2>${icon('list')}Letzte Trainings</h2><a class="btn btn-ghost btn-s" href="#/training/verlauf">Verlauf</a></div>
      <div class="list">${Workouts.all().slice(0, 5).map(w => `<a class="li" href="#/training/einheit/${w.id}"><div class="li-main"><div class="li-title">${esc(w.name)}</div><div class="li-sub">${fmtDate(w.start, { day: true })} · ${fmtMin(woDuration(w))} · ${w.items.map(it => Exercises.get(it.ex).name.split(' (')[0]).slice(0, 4).join(', ')}</div></div><div class="li-end">${fmt(woVolume(w))} kg</div></a>`).join('') || '<p class="empty">Noch keine Trainings.</p>'}</div></div>
  </div>`;

/* ---------- Timer & Rechner ---------- */
const SW = Local.get('sw', { start: 0, acc: 0, laps: [] });
const IV = { work: 40, rest: 20, rounds: 8, phase: null, round: 0, end: 0, iv: null };
function swElapsed() { return SW.acc + (SW.start ? Date.now() - SW.start : 0); }
function fmtSw(ms) { const s = Math.floor(ms / 1000); return `${fmtDur(s)},${String(Math.floor(ms % 1000 / 100))}`; }
function renderTools() {

  const c = 2 * Math.PI * 44;
  return `<div class="grid">
    <div class="card span-6"><div class="card-head"><h2>${icon('timer')}Pausentimer</h2>${RestTimer.st ? `<button class="btn btn-s" data-act="timerStop">Stopp</button>` : ''}</div>

        <div class="big-time" id="restBig">${fmtDur(Math.ceil(r))}</div></div>
      <div class="preset-row" style="margin-top:16px">${[30, 60, 90, 120, 180, 300].map(sec => `<button class="chip chip-btn" data-act="restStart" data-sec="${sec}">${fmtDur(sec)}</button>`).join('')}</div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn btn-s" data-act="timerAdd" data-sec="-15">−15 s</button><button class="btn btn-s" data-act="timerAdd" data-sec="15">+15 s</button>
      ${'Notification' in window && Notification.permission === 'default' ? `<button class="btn btn-s btn-ghost" data-act="notifAsk">Mitteilungen erlauben</button>` : ''}</div></div>
    <div class="card span-6"><div class="card-head"><h2>${icon('timer')}Stoppuhr</h2></div>
      <div class="big-time" data-tick="sw" style="margin:24px 0">${fmtSw(swElapsed())}</div>
      <div class="row" style="justify-content:center">
        <button class="btn btn-l ${SW.start ? '' : 'btn-primary'}" data-act="swToggle">${SW.start ? icon('pause') + 'Pause' : icon('play') + 'Start'}</button>
        <button class="btn btn-l" data-act="${SW.start ? 'swLap' : 'swReset'}">${SW.start ? 'Runde' : 'Zurücksetzen'}</button></div>
      <div class="list" style="margin-top:12px">${SW.laps.slice().reverse().map((l, i) => `<div class="li"><span class="li-main">Runde ${SW.laps.length - i}</span><span class="li-end">${fmtSw(l)}</span></div>`).join('')}</div></div>
    <div class="card span-6"><div class="card-head"><h2>${icon('bolt')}Intervalltimer</h2><span class="muted small">Tabata, HIIT, Zirkel</span></div>
      ${IV.phase ? `<div class="live"><p class="stat-label" data-tick="ivPhase">${IV.phase === 'work' ? 'Belastung' : IV.phase === 'rest' ? 'Pause' : 'Gleich geht’s los'}</p>
        <div class="big-time" data-tick="iv" style="margin:12px 0">${fmtDur(Math.ceil(Math.max(0, IV.end - Date.now()) / 1000))}</div>
        <p class="muted" data-tick="ivRound">Runde ${Math.max(1, IV.round)} von ${IV.rounds}</p>
        <button class="btn btn-l" style="margin-top:14px" data-act="ivStop">${icon('stop')}Stopp</button></div>` :
      `<div class="fields"><label class="field">Belastung (s)<input class="input" inputmode="numeric" id="ivWork" value="${IV.work}"></label>
        <label class="field">Pause (s)<input class="input" inputmode="numeric" id="ivRest" value="${IV.rest}"></label>

        <button class="btn btn-primary btn-block" data-act="ivStart">${icon('play')}Starten</button>`}</div>
    <div class="card span-6"><div class="card-head"><h2>${icon('trophy')}1RM-Rechner</h2></div>
      <div class="fields"><label class="field">Gewicht (kg)<input class="input" inputmode="decimal" id="ormKg" value="100" data-input="ormCalc"></label>

      <div id="ormOut" style="margin-top:12px">${ormTable(100, 5)}</div></div>
    <div class="card span-12"><div class="card-head"><h2>${icon('gym')}Scheibenrechner</h2><span class="muted small">pro Seite</span></div>
      <div class="fields"><label class="field">Zielgewicht (kg)<input class="input" inputmode="decimal" id="plTarget" value="100" data-input="plateCalc"></label>
      <label class="field">Stange (kg)<select class="input" id="plBar" data-change="plateCalc"><option value="20">Langhantel 20</option><option value="15">Damen-Stange 15</option><option value="10">SZ-Stange 10</option><option value="0">ohne</option></select></label></div>
      <div id="plOut">${plateHtml(100, 20)}</div></div>

}
function ormTable(kg, reps) {
  const m = e1rm(kg, reps);
  if (!m) return '<p class="muted">Gewicht und Wiederholungen eingeben.</p>';
  const rows = [[100, 1], [95, 2], [93, 3], [90, 4], [87, 5], [85, 6], [80, 8], [75, 10], [70, 12], [65, 15]];
  return `<p style="margin-bottom:8px">Geschätztes 1RM: <b style="font-size:22px">${fmt(m, 1)} kg</b></p>
    <table class="ntable"><thead><tr><th>% vom 1RM</th><th>Gewicht</th><th>≈ Wdh.</th></tr></thead><tbody>${rows.map(([p, r]) => `<tr><td>${p} %</td><td>${fmt(Math.round(m * p / 100 / 1.25) * 1.25, 2)} kg</td><td>${r}</td></tr>`).join('')}</tbody></table>`;
}
function plateHtml(target, bar) {
  const PL = [[25, '#d03b3b', 110], [20, '#2a78d6', 104], [15, '#b38200', 96], [10, '#1baf7a', 86], [5, '#6a7082', 70], [2.5, '#394052', 58], [1.25, '#8c93a3', 48]];
  let rest = (target - bar) / 2;
  if (rest < 0) return '<p class="muted" style="margin-top:12px">Ziel ist leichter als die Stange.</p>';
  const used = [];
  PL.forEach(([w, c, h]) => { while (rest >= w - 1e-9) { used.push([w, c, h]); rest -= w; } });
  return `<div class="plates" aria-label="Scheiben pro Seite"><span class="bar-sleeve"></span>${used.map(([w, c, h]) => `<span class="plate" style="background:${c};height:${h}px;width:${w >= 10 ? 22 : 16}px">${fmt(w, 2)}</span>`).join('')}<span class="bar-sleeve" style="width:24px"></span></div>
    <p class="small" style="text-align:center">${used.length ? used.map(u => fmt(u[0], 2)).join(' + ') + ' kg je Seite' : 'Nur die Stange'}${rest > 0.01 ? ` · ${fmt(rest * 2, 2)} kg passen nicht genau` : ''}</p>`;
}
A.ormCalc = () => { $('#ormOut').innerHTML = ormTable(num($('#ormKg').value), Math.round(num($('#ormReps').value))); };
A.plateCalc = () => { $('#plOut').innerHTML = plateHtml(num($('#plTarget').value), num($('#plBar').value)); };

A.notifAsk = () => { Notification.requestPermission().then(() => rerender()); };

  if (!big) return;
  const r = RestTimer.st ? RestTimer.remaining() : 0, tot = RestTimer.st ? RestTimer.st.total : 1, c = 2 * Math.PI * 44;
  big.textContent = fmtDur(Math.ceil(r));
  ringEl.setAttribute('stroke-dashoffset', (c * (1 - r / tot)).toFixed(1));
});
A.swToggle = () => { if (SW.start) { SW.acc += Date.now() - SW.start; SW.start = 0; } else SW.start = Date.now(); Local.set('sw', SW); rerender(); };

  IV.work = Math.max(5, Math.round(num($('#ivWork').value))); IV.rest = Math.max(0, Math.round(num($('#ivRest').value))); IV.rounds = Math.max(1, Math.round(num($('#ivRounds').value)));
  IV.phase = 'prep'; IV.round = 0; IV.end = Date.now() + 5000;

  rerender();
};

function ivTick() {
  if (Date.now() < IV.end) return;
  if (IV.phase === 'prep' || IV.phase === 'rest') {
    IV.round++; IV.phase = 'work'; IV.end = Date.now() + IV.work * 1000; Beep.play(2, 1175); Beep.buzz([300]);
  } else if (IV.phase === 'work') {
    if (IV.round >= IV.rounds) { clearInterval(IV.iv); IV.phase = null; Beep.play(4); Beep.buzz(); toast('Intervalle geschafft!'); rerender(); return; }
    if (IV.rest) { IV.phase = 'rest'; IV.end = Date.now() + IV.rest * 1000; Beep.play(1, 660); Beep.buzz([120]); }
    else { IV.round++; IV.end = Date.now() + IV.work * 1000; Beep.play(2, 1175); }

function calorieSummary(k, compact) {
  const s = settings(), d = Diary.day(k), t = Diary.totals(d);

    ${ring((t.kcal) / Math.max(1, s.kcalGoal + ex), fmt(Math.abs(left)), over ? 'zu viel' : 'übrig', { over, small: compact, aria: `${fmt(t.kcal)} von ${fmt(s.kcalGoal + ex)} kcal gegessen` })}
